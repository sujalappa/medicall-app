services:
  - type: web
    name: saleslens-backend
    env: python
    rootDir: backend
    buildCommand: |
      pip install uv
      uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_ROUTER_BASE_URL
        value: https://router.huggingface.co/v1
